<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Claritly</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/styles.css?v=2">
    <style>
        .dashboard-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: calc(100vh - 80px);
            padding: 40px 20px;
            text-align: center;
        }
        .dashboard-welcome {
            font-family: 'Outfit', sans-serif;
            font-size: 2.2rem;
            font-weight: 700;
            color: var(--dark, #1a1a2e);
            margin-bottom: 8px;
        }
        .dashboard-welcome .name {
            background: linear-gradient(135deg, #FF7139, #FFB03A);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .dashboard-subtitle {
            font-size: 1.05rem;
            color: var(--gray, #6b7280);
            font-weight: 400;
            margin-bottom: 48px;
        }
        .usage-ring-container {
            position: relative;
            width: 260px;
            height: 260px;
            margin-bottom: 32px;
        }
        .usage-ring-container svg {
            width: 100%;
            height: 100%;
            transform: rotate(-90deg);
            filter: drop-shadow(0 4px 20px rgba(255, 113, 57, 0.15));
        }
        .usage-ring-bg {
            fill: none;
            stroke: #f1f5f9;
            stroke-width: 3;
        }
        .usage-ring-progress {
            fill: none;
            stroke: url(#usage-gradient);
            stroke-width: 3;
            stroke-linecap: round;
            stroke-dasharray: 0, 100;
            transition: stroke-dasharray 1.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .usage-ring-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }
        .usage-count {
            font-family: 'Outfit', sans-serif;
            font-size: 4rem;
            font-weight: 700;
            color: var(--dark, #1a1a2e);
            line-height: 1;
        }
        .usage-label {
            font-size: 1.1rem;
            color: var(--gray, #6b7280);
            font-weight: 500;
        }
        .usage-caption {
            font-size: 0.95rem;
            color: var(--gray, #6b7280);
            font-weight: 400;
        }
    </style>
</head>
<body class="bg-light">

    <!-- Navigation -->
    <nav class="navbar glass">
        <div class="container nav-container">
            <a href="index.html" class="logo">
                <img src="logo.png" alt="Claritly Logo" class="logo-img" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%23FF7139%22 stroke-width=%222%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22%3E%3Cpath d=%22M12 2L2 7l10 5 10-5-10-5z%22/%3E%3Cpath d=%22M2 17l10 5 10-5%22/%3E%3Cpath d=%22M2 12l10 5 10-5%22/%3E%3C/svg%3E'">
                <span>Claritly</span>
            </a>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="index.html#tones">Tones</a>
                <a href="pricing.html">Pricing</a>
                <div id="auth-buttons" class="auth-buttons">
                    <!-- Injected by JS -->
                </div>
            </div>
            </div>
        </div>
    </nav>

    <!-- Dashboard Content -->
    <div class="dashboard-center">
        <h1 class="dashboard-welcome">Welcome back, <span class="name" id="user-name"></span></h1>
        <p class="dashboard-subtitle">Here's your Claritly usage overview</p>

        <!-- Large Usage Ring -->
        <div class="usage-ring-container">
            <svg viewBox="0 0 36 36">
                <defs>
                    <linearGradient id="usage-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#FF7139" />
                        <stop offset="100%" stop-color="#FFB03A" />
                    </linearGradient>
                </defs>
                <path class="usage-ring-bg" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                <path id="usage-circle-path" class="usage-ring-progress" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
            </svg>

            <div class="usage-ring-center">
                <span class="usage-count" id="usage-count">0</span>
                <span class="usage-label">of <span id="usage-limit">100</span></span>
            </div>
        </div>

        <p class="usage-caption">AI rewrites used</p>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
