<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Claritly</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-light">

    <!-- Navigation -->
    <nav class="navbar glass">
        <div class="container nav-container">
            <a href="index.html" class="logo">
                <img src="https://lxrrpuytbobhkkzvatew.supabase.co/storage/v1/object/public/assets/icon.png" alt="Claritly Logo" class="logo-img" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%23FF7139%22 stroke-width=%222%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22%3E%3Cpath d=%22M12 2L2 7l10 5 10-5-10-5z%22/%3E%3Cpath d=%22M2 17l10 5 10-5%22/%3E%3Cpath d=%22M2 12l10 5 10-5%22/%3E%3C/svg%3E'">
                <span>Claritly</span>
            </a>
            <div class="nav-links">
                <div id="auth-buttons" class="auth-buttons">
                    <!-- Injected by JS -->
                </div>
            </div>
        </div>
    </nav>

    <!-- Dashboard Content -->
    <header class="dashboard-header">
        <div class="container">
            <h1 class="hero-title" style="font-size: 3rem;">Welcome back, <br><span class="text-gradient" id="user-name">Loading...</span></h1>
            
            <div class="dashboard-stats">
                <div class="stat-card">
                    <div class="stat-title">Current Plan</div>
                    <div class="stat-value text-gradient" id="plan-name">Free</div>
                    <p style="color: var(--gray); margin-top: 10px;">Upgrade to Premium for unlimited rewrites and custom tones.</p>
                </div>
                
                <div class="stat-card" style="display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 32px 20px;">
                    <div class="stat-title" style="margin-bottom: 24px; text-align: center; width: 100%;">AI Rewrites Used</div>
                    
                    <!-- Circular Chart -->
                    <div style="position: relative; width: 150px; height: 150px;">
                        <svg viewBox="0 0 36 36" style="width: 100%; height: 100%; transform: rotate(-90deg);">
                            <!-- Background Track -->
                            <path d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" fill="none" stroke="#f1f5f9" stroke-width="2.5" />
                            <!-- Progress Track -->
                            <path id="usage-circle-path" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" fill="none" stroke="url(#orange-gradient)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="0, 100" style="transition: stroke-dasharray 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);" />
                            <!-- Gradient Definition -->
                            <defs>
                                <linearGradient id="orange-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                                    <stop offset="0%" stop-color="#FF7139" />
                                    <stop offset="100%" stop-color="#FFB03A" />
                                </linearGradient>
                            </defs>
                        </svg>
                        
                        <!-- Center Text inside Circle -->
                        <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; display: flex; flex-direction: column; align-items: center;">
                            <span id="usage-count" style="font-size: 2.2rem; font-weight: 700; color: var(--dark); line-height: 1;">0</span>
                            <div style="font-size: 0.9rem; color: var(--gray); font-weight: 500; margin-top: 6px;">of <span id="usage-limit">100</span></div>
                        </div>
                    </div>
                </div>
            </div>

            <div id="upgrade-section" style="margin-top: 32px;">
                <h3 style="margin-bottom: 16px;">Manage Subscription</h3>
                <div class="glass-card" style="display: flex; justify-content: space-between; align-items: center;">
                    <div>
                        <h4 style="font-size: 1.25rem;">Premium Plan</h4>
                        <p style="color: var(--gray);">Unlimited AI rewriting, all premium tones, and priority support.</p>
                    </div>
                    <button id="upgrade-btn" class="btn btn-primary">Upgrade for $5/mo</button>
                </div>
            </div>
        </div>
    </header>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
